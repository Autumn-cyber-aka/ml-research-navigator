[project]
name = "ml-research-navigator"
version = "0.1.0"
description = "A relational research-paper workspace built with Flask and MySQL"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4",
  "Flask-WTF>=1.2,<2",
  "PyMySQL[rsa]>=1.1,<2",
  "python-dotenv>=1,<2",
  "gunicorn>=23,<24",
  "sqlparse>=0.5,<1",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1", "beautifulsoup4>=4.13,<5"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
